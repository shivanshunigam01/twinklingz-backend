# /etc/nginx/sites-available/api.twinklingz.com
# On a shared VPS, port 5000 is often another app (e.g. patliputra-api).
# Twinklingz uses PORT=5010 — keep proxy_pass in sync with backend .env / PM2.
#
# sudo ln -sf /etc/nginx/sites-available/api.twinklingz.com /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.twinklingz.com;

    # After certbot, this file usually gains listen 443 ssl and certificates.

    location / {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
