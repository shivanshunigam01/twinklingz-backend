# /etc/nginx/sites-available/api.twinklingz.com
# sudo ln -sf /etc/nginx/sites-available/api.twinklingz.com /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.twinklingz.com;

    # certbot adds SSL; include cert paths after: sudo certbot --nginx -d api.twinklingz.com

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
